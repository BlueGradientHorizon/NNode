<section id="page-status-log" hidden>
    <h2 data-i18n="p_log">Системный лог</h2>
    <p class="descr" data-i18n="d_log">Последние сообщения прошивки.</p>
    <p><select id="log-level">
      <option value="V" data-i18n="log_all">Все</option>
      <option value="D">Debug</option>
      <option value="I">Info</option>
      <option value="W">Warning</option>
      <option value="E">Error</option>
    </select>
    <button id="log-clear" class="btn" type="button" data-i18n="log_clear">Очистить</button></p>
    <pre id="log-out"></pre>
  </section>
